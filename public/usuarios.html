<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRCASA | Usuarios del sistema</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4">
    <h1 class="h4 mb-3">Usuarios del sistema</h1>
    <p class="text-muted">Cuentas de los empleados. Los clientes no tienen usuario.</p>
    <div id="catalogo"></div>
  </main>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    requerirSesion(['soporte']);
    // USUARIOS = empleados que usan el sistema. Solo soporte técnico los administra.
    Catalogo({
      contenedor: '#catalogo', endpoint: '/usuarios', id: 'id_usuario', nombre: 'usuario', textoNuevo: 'Nuevo usuario', buscar: false,
      columnas: [
        { campo: 'nombre', titulo: 'Nombre' }, { campo: 'usuario', titulo: 'Usuario', formato: (v) => `<code>${esc(v)}</code>` },
        { campo: 'rol', titulo: 'Rol', formato: (v) => ETIQUETA_ROL[v] },
        { campo: 'activo', titulo: 'Estado', formato: (v) => v ? '<span class="badge text-bg-success">Activo</span>' : '<span class="badge text-bg-secondary">Inactivo</span>' },
      ],
      campos: [
        { campo: 'nombre', etiqueta: 'Nombre completo', requerido: true },
        { campo: 'usuario', etiqueta: 'Usuario para iniciar sesión', requerido: true, soloAlCrear: true },
        { campo: 'rol', etiqueta: 'Rol', tipo: 'select', requerido: true, porDefecto: 'capturista',
          opciones: [['capturista', 'Capturista'], ['administrador', 'Administrador (dueño/encargado)'], ['soporte', 'Soporte técnico']] },
        { campo: 'activo', etiqueta: 'Estado', tipo: 'select', requerido: true, soloEditar: true, opciones: [[1, 'Activo'], [0, 'Inactivo']] },
        { campo: 'password', etiqueta: 'Contraseña', tipo: 'password', ayuda: 'Mínimo 8 caracteres. Al editar, déjala vacía para no cambiarla.' },
      ],
    });
  </script>
</body>
</html>
