<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRCASA | Compras a proveedores</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4">
    <h1 class="h4 mb-1">Compras a proveedores</h1>
    <p class="text-muted">Mercancía que llega a la papelería. Al registrarla se suma a la existencia y se actualiza el costo.</p>

    <div class="card mb-4"><div class="card-body">
      <div class="row g-2 mb-3">
        <div class="col-md-5"><label class="form-label">Proveedor *</label><select id="proveedor" class="form-select"></select></div>
        <div class="col-md-3"><label class="form-label">Folio de la factura o nota del proveedor</label><input id="folio" class="form-control"></div>
      </div>
      <div class="row g-2 mb-2 align-items-end">
        <div class="col-md-5"><label class="form-label">Código del producto</label><input id="codigo" class="form-control" placeholder="Enter para agregar"></div>
        <div class="col-md-2"><label class="form-label">Cantidad</label><input id="cantidad" type="number" min="1" value="1" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">Costo unitario</label><input id="costo" type="number" min="0" step="0.01" class="form-control"></div>
        <div class="col-md-2"><button class="btn btn-outline-primary w-100" id="btn-agregar"><i class="bi bi-plus-lg"></i> Agregar</button></div>
      </div>
      <table class="table table-sm">
        <thead><tr><th>Código</th><th>Producto</th><th class="text-end">Cantidad</th><th class="money">Costo</th><th class="money">Importe</th><th></th></tr></thead>
        <tbody id="partidas"></tbody>
        <tfoot><tr><th colspan="4" class="text-end">Total</th><th class="money" id="total">$0.00</th><th></th></tr></tfoot>
      </table>
      <button class="btn btn-success" id="btn-guardar"><i class="bi bi-box-arrow-in-down"></i> Registrar compra</button>
    </div></div>

    <h2 class="h5">Historial</h2>
    <div class="card"><div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>#</th><th>Fecha</th><th>Proveedor</th><th>Folio proveedor</th><th class="text-end">Productos</th><th class="money">Total</th><th>Registró</th></tr></thead>
        <tbody id="historial"></tbody>
      </table>
    </div></div>
  </main>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    requerirSesion(['administrador', 'soporte']);
    const $ = (id) => document.getElementById(id);
    let partidas = [];
    let producto = null;

    function pintar() {
      $('partidas').innerHTML = partidas.map((p, i) => `<tr><td><code>${esc(p.codigo)}</code></td><td>${esc(p.nombre)}</td>
        <td class="text-end">${p.cantidad}</td><td class="money">${dinero(p.costo_unitario)}</td>
        <td class="money">${dinero(p.cantidad * p.costo_unitario)}</td>
        <td class="text-end"><button class="btn btn-sm btn-outline-danger" data-quitar="${i}"><i class="bi bi-x-lg"></i></button></td></tr>`).join('')
        || '<tr><td colspan="6" class="text-muted text-center">Sin productos</td></tr>';
      $('total').textContent = dinero(partidas.reduce((s, p) => s + p.cantidad * p.costo_unitario, 0));
    }

    // Al teclear el código trae el producto y propone su último costo
    $('codigo').addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter' || !e.target.value.trim()) return;
      try {
        producto = await API.get(`/productos/codigo/${encodeURIComponent(e.target.value.trim())}`);
        $('costo').value = producto.costo;
        $('codigo').classList.add('is-valid');
        $('cantidad').select();
      } catch (err) { producto = null; avisarError(err); }
    });
    $('codigo').addEventListener('input', () => { producto = null; $('codigo').classList.remove('is-valid'); });

    $('btn-agregar').addEventListener('click', () => {
      if (!producto) return avisar('Teclea el código y presiona Enter', 'warning');
      const cantidad = parseInt($('cantidad').value, 10);
      const costo = Number($('costo').value);
      if (!(cantidad > 0) || !(costo >= 0)) return avisar('Revisa cantidad y costo', 'warning');
      partidas.push({ id_producto: producto.id_producto, codigo: producto.codigo, nombre: producto.nombre, cantidad, costo_unitario: costo });
      producto = null;
      $('codigo').value = ''; $('cantidad').value = 1; $('costo').value = '';
      $('codigo').classList.remove('is-valid'); $('codigo').focus();
      pintar();
    });
    $('partidas').addEventListener('click', (e) => {
      const b = e.target.closest('[data-quitar]');
      if (b) { partidas.splice(b.dataset.quitar, 1); pintar(); }
    });

    $('btn-guardar').addEventListener('click', async () => {
      try {
        const r = await API.post('/compras', { id_proveedor: $('proveedor').value, folio_proveedor: $('folio').value, partidas });
        avisar(r.mensaje);
        partidas = []; $('folio').value = ''; pintar(); historial();
      } catch (err) { avisarError(err); }
    });

    async function historial() {
      const filas = await API.get('/compras');
      $('historial').innerHTML = filas.map((c) => `<tr><td>${c.id_compra}</td><td>${fecha(c.fecha)}</td><td>${esc(c.proveedor)}</td>
        <td>${esc(c.folio_proveedor || '')}</td><td class="text-end">${c.productos}</td><td class="money">${dinero(c.total)}</td><td>${esc(c.registro)}</td></tr>`).join('')
        || '<tr><td colspan="7" class="text-center text-muted py-3">Sin compras registradas</td></tr>';
    }

    (async () => {
      const provs = await API.get('/proveedores');
      $('proveedor').innerHTML = '<option value="">Selecciona...</option>' + provs.map((p) => `<option value="${p.id_proveedor}">${esc(p.nombre)}</option>`).join('');
      pintar(); historial();
    })().catch(avisarError);
  </script>
</body>
</html>
