<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRCASA | Iniciar sesión</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">
  <main class="container">
    <div class="card form-box mx-auto">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1" style="color:var(--crcasa)">Papelería CRCASA</h1>
        <p class="text-center text-muted small mb-4">Sistema de ventas e inventario · Acceso para empleados</p>
        <form id="form-login" novalidate>
          <div class="mb-3">
            <label class="form-label" for="usuario">Usuario</label>
            <input id="usuario" class="form-control" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input id="password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <div id="error" class="alert alert-danger d-none py-2"></div>
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="text-muted small text-center mt-3 mb-0">Si no tienes usuario, pídelo al administrador de la papelería.</p>
      </div>
    </div>
  </main>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (API.token()) location.href = '/venta.html';
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.classList.add('d-none');
      try {
        const r = await API.post('/auth/login', {
          usuario: document.getElementById('usuario').value,
          password: document.getElementById('password').value,
        });
        API.guardarSesion(r);
        location.href = r.usuario.rol === 'capturista' ? '/venta.html' : '/panel.html';
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
