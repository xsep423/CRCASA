<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papelería CRCASA | Catálogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark navbar-expand">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">📚 Papelería CRCASA</a>
      <div id="nav-usuario" class="d-flex align-items-center"></div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-2 mb-4">
      <div class="col-md-8">
        <input id="buscar" class="form-control" placeholder="Buscar producto...">
      </div>
      <div class="col-md-4">
        <select id="filtro" class="form-select">
          <option value="">Todas las categorías</option>
        </select>
      </div>
    </div>

    <div id="mensaje" class="text-muted"></div>
    <div id="catalogo" class="row g-3"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const fmt = (n) => Number(n).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });

    async function cargarClasificaciones() {
      const cats = await API.request('/api/clasificaciones');
      const sel = document.getElementById('filtro');
      cats.forEach(c => sel.insertAdjacentHTML('beforeend', `<option value="${c.id_clasificacion}">${c.nombre}</option>`));
    }

    async function cargarProductos() {
      const params = new URLSearchParams();
      const cat = document.getElementById('filtro').value;
      const q = document.getElementById('buscar').value.trim();
      if (cat) params.set('clasificacion', cat);
      if (q) params.set('buscar', q);

      const cont = document.getElementById('catalogo');
      const msg = document.getElementById('mensaje');
      try {
        const productos = await API.request('/api/productos?' + params);
        msg.textContent = productos.length ? '' : 'No se encontraron productos.';
        cont.innerHTML = productos.map(p => `
          <div class="col-6 col-md-4 col-lg-3">
            <div class="card card-producto h-100 shadow-sm">
              ${p.imagen_url ? `<img src="${p.imagen_url}" class="card-img-top" alt="${p.nombre}">`
                             : `<div class="placeholder-img">✏️</div>`}
              <div class="card-body d-flex flex-column">
                <span class="badge bg-secondary mb-2 align-self-start">${p.clasificacion}</span>
                <h6 class="card-title">${p.nombre}</h6>
                <p class="small text-muted flex-grow-1">${p.descripcion || ''}</p>
                <div class="d-flex justify-content-between align-items-center">
                  <span class="precio">${fmt(p.precio)}</span>
                  <small class="${p.stock > 0 ? 'text-success' : 'text-danger'}">
                    ${p.stock > 0 ? `Stock: ${p.stock}` : 'Agotado'}</small>
                </div>
                <!-- TODO (módulo de ventas): botón "Agregar al carrito" -->
              </div>
            </div>
          </div>`).join('');
      } catch (e) {
        msg.textContent = 'Error al cargar el catálogo: ' + e.message;
      }
    }

    document.getElementById('filtro').addEventListener('change', cargarProductos);
    let t; document.getElementById('buscar').addEventListener('input', () => { clearTimeout(t); t = setTimeout(cargarProductos, 300); });

    cargarClasificaciones().then(cargarProductos);
  </script>
</body>
</html>
