<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRCASA | Reportes de ventas</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4">
    <h1 class="h4 mb-1">Reportes de ventas</h1>
    <p class="text-muted no-print">Elige el periodo y cómo agrupar. Las ventas canceladas no se suman.</p>

    <div class="card mb-3 no-print"><div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-2"><label class="form-label">Desde</label><input id="desde" type="date" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">Hasta</label><input id="hasta" type="date" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">Agrupar por</label>
          <select id="agrupar" class="form-select">
            <option value="dia">Día</option><option value="empleado">Empleado</option><option value="metodo">Forma de pago</option>
            <option value="clasificacion">Clasificación</option><option value="producto">Producto</option>
          </select></div>
        <div class="col-md-5 d-flex gap-2">
          <button class="btn btn-primary" id="btn-consultar"><i class="bi bi-search"></i> Consultar</button>
          <button class="btn btn-outline-success" id="btn-excel"><i class="bi bi-file-earmark-spreadsheet"></i> Excel</button>
          <button class="btn btn-outline-danger" onclick="window.print()"><i class="bi bi-file-earmark-pdf"></i> PDF / Imprimir</button>
        </div>
      </div>
    </div></div>

    <div id="encabezado-impresion" class="d-none d-print-block mb-2"></div>
    <div class="row g-3 mb-3" id="resumen"></div>
    <div class="card"><div class="table-responsive">
      <table class="table mb-0">
        <thead class="table-light"><tr><th id="col-grupo">Día</th><th class="text-end">Ventas</th><th class="text-end">Piezas</th><th class="money">Importe</th><th style="width:30%" class="no-print"></th></tr></thead>
        <tbody id="filas"></tbody>
        <tfoot class="table-light"><tr><th>Total</th><th class="text-end" id="f-ventas"></th><th class="text-end" id="f-piezas"></th><th class="money" id="f-total"></th><th class="no-print"></th></tr></tfoot>
      </table>
    </div></div>
    <p class="small text-muted mt-2" id="nota-importe"></p>
  </main>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const yo = requerirSesion(['administrador', 'soporte']);
    const $ = (id) => document.getElementById(id);
    const NOMBRES = { dia: 'Día', empleado: 'Empleado', metodo: 'Forma de pago', clasificacion: 'Clasificación', producto: 'Producto' };
    let datos = null;

    const hoy = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    $('desde').value = hoy.slice(0, 8) + '01';
    $('hasta').value = hoy;

    const etiqueta = (g) => (datos.agrupar === 'dia' ? fechaCorta(g) : datos.agrupar === 'metodo' ? g[0].toUpperCase() + g.slice(1) : g);

    async function consultar() {
      try {
        const q = new URLSearchParams({ desde: $('desde').value, hasta: $('hasta').value, agrupar: $('agrupar').value });
        datos = await API.get('/reportes/ventas?' + q);
        const r = datos.resumen;
        const tarjeta = (t, v, extra = '') => `<div class="col-6 col-md-3"><div class="card"><div class="card-body py-2">
          <div class="small text-muted">${t}</div><div class="fs-4 fw-bold">${v}</div><div class="small text-muted">${extra}</div></div></div></div>`;
        $('resumen').innerHTML = tarjeta('Ventas', r.ventas, `${r.canceladas} cancelada(s)`) + tarjeta('Vendido', dinero(r.total))
          + tarjeta('Descuentos otorgados', dinero(r.descuentos)) + tarjeta('Ticket promedio', dinero(r.ventas ? r.total / r.ventas : 0));
        $('col-grupo').textContent = NOMBRES[datos.agrupar];
        const max = Math.max(...datos.filas.map((f) => Number(f.total)), 1);
        $('filas').innerHTML = datos.filas.map((f) => `<tr><td>${esc(etiqueta(f.grupo))}</td><td class="text-end">${f.ventas}</td>
          <td class="text-end">${Number(f.piezas)}</td><td class="money">${dinero(f.total)}</td>
          <td class="no-print"><div class="bg-primary rounded" style="height:10px;width:${(Number(f.total) / max) * 100}%;opacity:.7"></div></td></tr>`).join('')
          || '<tr><td colspan="5" class="text-center text-muted py-4">Sin ventas en el periodo</td></tr>';
        const detalle = ['clasificacion', 'producto'].includes(datos.agrupar);
        $('f-ventas').textContent = detalle ? '' : r.ventas;
        $('f-piezas').textContent = datos.filas.reduce((s, f) => s + Number(f.piezas), 0);
        $('f-total').textContent = dinero(datos.filas.reduce((s, f) => s + Number(f.total), 0));
        $('nota-importe').textContent = detalle ? 'Por clasificación y producto, el importe de cada renglón ya lleva aplicado el descuento de su venta. Una venta puede contar en varias filas.' : '';
        $('encabezado-impresion').innerHTML = `<h2 class="h5 mb-0">${esc(yo.papeleria || '')} · Reporte de ventas por ${NOMBRES[datos.agrupar].toLowerCase()}</h2>
          <small>Del ${fechaCorta(datos.desde)} al ${fechaCorta(datos.hasta)}</small>`;
      } catch (err) { avisarError(err); }
    }

    // Excel: CSV con BOM para que Excel respete acentos
    $('btn-excel').addEventListener('click', () => {
      if (!datos) return;
      const celda = (v) => `"${String(v).replace(/"/g, '""')}"`;
      const lineas = [[NOMBRES[datos.agrupar], 'Ventas', 'Piezas', 'Importe'].map(celda).join(','),
        ...datos.filas.map((f) => [etiqueta(f.grupo), f.ventas, Number(f.piezas), Number(f.total).toFixed(2)].map(celda).join(','))];
      const blob = new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `reporte-ventas-${datos.agrupar}-${datos.desde}-a-${datos.hasta}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
    $('btn-consultar').addEventListener('click', consultar);
    $('agrupar').addEventListener('change', consultar);
    consultar();
  </script>
</body>
</html>
