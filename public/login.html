<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papelería CRCASA | Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/">📚 Papelería CRCASA</a></div></nav>

  <main class="container py-5">
    <div class="card form-box mx-auto shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Iniciar sesión</h4>
        <div id="alerta"></div>
        <form id="form-login" novalidate>
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="mt-3 mb-0 small text-center">¿No tienes cuenta? <a href="/registro.html">Regístrate</a></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(e.target));
      const alerta = document.getElementById('alerta');
      if (!datos.email || !datos.password) {
        alerta.innerHTML = '<div class="alert alert-warning">Llena todos los campos</div>'; return;
      }
      try {
        const r = await API.request('/api/auth/login', { method: 'POST', body: JSON.stringify(datos) });
        API.guardarSesion(r);
        location.href = '/';  // TODO: redirigir al panel según rol (admin/vendedor)
      } catch (err) {
        alerta.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
