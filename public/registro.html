<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papelería CRCASA | Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/">📚 Papelería CRCASA</a></div></nav>

  <main class="container py-5">
    <div class="card form-box mx-auto shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Crear cuenta</h4>
        <div id="alerta"></div>
        <form id="form-registro" novalidate>
          <div class="mb-3">
            <label class="form-label">Tipo de cliente</label>
            <select name="tipo" id="tipo" class="form-select">
              <option value="cliente">Cliente individual</option>
              <option value="mayorista">Cliente mayorista (escuela, empresa u oficina)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input name="nombre" class="form-control" required minlength="3">
          </div>
          <div class="mb-3 d-none" id="campo-empresa">
            <label class="form-label">Empresa / escuela</label>
            <input name="empresa" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Teléfono (opcional)</label>
            <input name="telefono" class="form-control" pattern="[0-9\- ]{7,20}">
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña (mín. 8 caracteres)</label>
            <input type="password" name="password" class="form-control" required minlength="8">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmar contraseña</label>
            <input type="password" name="confirmar" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100">Registrarme</button>
        </form>
        <p class="mt-3 mb-0 small text-center">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const tipo = document.getElementById('tipo');
    tipo.addEventListener('change', () =>
      document.getElementById('campo-empresa').classList.toggle('d-none', tipo.value !== 'mayorista'));

    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const alerta = document.getElementById('alerta');
      const datos = Object.fromEntries(new FormData(form));

      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        alerta.innerHTML = '<div class="alert alert-warning">Revisa los campos marcados</div>'; return;
      }
      if (datos.password !== datos.confirmar) {
        alerta.innerHTML = '<div class="alert alert-warning">Las contraseñas no coinciden</div>'; return;
      }
      delete datos.confirmar;
      try {
        await API.request('/api/auth/registro', { method: 'POST', body: JSON.stringify(datos) });
        alerta.innerHTML = '<div class="alert alert-success">Cuenta creada. Redirigiendo al login...</div>';
        setTimeout(() => location.href = '/login.html', 1200);
      } catch (err) {
        alerta.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
