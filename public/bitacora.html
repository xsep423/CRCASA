<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRCASA | Bitácora</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4">
    <h1 class="h4 mb-1">Bitácora</h1>
    <p class="text-muted">Quién hizo qué y cuándo: cancelaciones, cambios de precio y descuento, compras, cortes de caja y cambios de usuarios.</p>
    <div class="card mb-3"><div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-2"><label class="form-label">Desde</label><input id="desde" type="date" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">Hasta</label><input id="hasta" type="date" class="form-control"></div>
        <div class="col-md-5"><label class="form-label">Buscar</label><input id="buscar" class="form-control" placeholder="Acción, detalle o empleado"></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" id="btn"><i class="bi bi-search"></i> Consultar</button></div>
      </div>
    </div></div>
    <div class="card"><div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>Fecha</th><th>Empleado</th><th>Acción</th><th>Detalle</th></tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div></div>
  </main>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    requerirSesion(['administrador', 'soporte']);
    const $ = (id) => document.getElementById(id);
    const COLOR = { 'Cancelar venta': 'danger', 'Cancelar cotización': 'warning', 'Cambiar precio': 'info', 'Cambiar descuento': 'info',
      'Asignar descuento': 'info', 'Corte de caja': 'success', 'Registrar compra': 'primary' };
    const hoy = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    $('desde').value = hoy.slice(0, 8) + '01';
    $('hasta').value = hoy;
    async function cargar() {
      try {
        const q = new URLSearchParams({ desde: $('desde').value, hasta: $('hasta').value, buscar: $('buscar').value.trim() });
        const filas = await API.get('/bitacora?' + q);
        $('filas').innerHTML = filas.map((b) => `<tr><td class="text-nowrap">${fecha(b.fecha)}</td>
          <td>${esc(b.usuario || '—')}${b.rol ? `<br><small class="text-muted">${ETIQUETA_ROL[b.rol]}</small>` : ''}</td>
          <td><span class="badge text-bg-${COLOR[b.accion] || 'secondary'}">${esc(b.accion)}</span></td><td>${esc(b.detalle || '')}</td></tr>`).join('')
          || '<tr><td colspan="4" class="text-center text-muted py-4">Sin registros en el periodo</td></tr>';
      } catch (err) { avisarError(err); }
    }
    $('btn').addEventListener('click', cargar);
    $('buscar').addEventListener('keydown', (e) => { if (e.key === 'Enter') cargar(); });
    cargar();
  </script>
</body>
</html>
